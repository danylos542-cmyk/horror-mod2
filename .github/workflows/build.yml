name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'adopt'
    
    - name: Build with Gradle
      run: gradlew build
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: HorrorMod-1.20.1
        path: build/libs/*.jar
